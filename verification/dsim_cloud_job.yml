name: dsim-cloud-job
keep_for_support: false
tasks:
  - name: sim-sv
    compute_size: s4
    commands:
      - dvlcom -sv example.sv
      - dvlcom -sv axi4_lite_pkg.sv
      - dvlcom -sv axi4_lite_bfm.sv
      - dvlcom -sv example_if.sv
      - dvlcom -sv reg_tests.sv
      - dsim -top work.tb
    outputs:
      artifacts:
        - name: sim-sv-log
          path: dsim.log
  - name: sim-v
    compute_size: s4
    commands:
      - dvlcom -vlog2005 example.v
      - dvlcom -sv axi4_lite_pkg.sv
      - dvlcom -sv axi4_lite_bfm.sv
      - dvlcom -sv example_if.sv
      - dvlcom -sv reg_tests.sv
      - dsim -top work.tb
    outputs:
      artifacts:
        - name: sim-v-log
          path: dsim.log
  - name: sim-vhdl
    compute_size: s4
    commands:
      - dvhcom -vhdl2008 example.vhd
      - dvlcom -sv axi4_lite_pkg.sv
      - dvlcom -sv axi4_lite_bfm.sv
      - dvlcom -sv example_if.sv
      - dvlcom -sv reg_tests.sv
      - dsim -top work.tb
    outputs:
      artifacts:
        - name: sim-vhdl-log
          path: dsim.log