name: CI
on:
  push:
    branches:
      - main  # Run the tests on push to main branch
      - 56-migrate-away-from-dsim-cloud
  pull_request:
    branches:
      - main  # Run the tests on PRs to main branch
  schedule:
    - cron: "0 3 * * 0"  # Fixed: missing space in cron expression
jobs:
  test_common:
    runs-on: ubuntu-latest  # This specifies the runner environment
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      # Continue running other versions even if experimental ones fail
      fail-fast: false
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated to v5 for better Python 3.14 support
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true  # This allows beta and dev versions
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pipx
        pipx ensurepath
        pipx install uv
        # Handle potential compatibility issues with newer Python versions
        uv sync --extra dev
    - name: Run tests
      run: uv run pytest test/test_regdef.py test/test_argparse.py test/test_validate.py
      continue-on-error: ${{ matrix.experimental || false }}
    - name: Upload test results for experimental versions
      if: matrix.experimental && always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: test-results/
        retention-days: 7

  test_rtl:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install system dependencies (simulators)
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator ghdl-gcc
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pipx
        pipx ensurepath
        pipx install uv
        uv sync --extra dev --extra rtl
    - name: Run cocotb RTL tests (Verilator + GHDL)
      run: COCOTB_IGNORE_PYTHON_REQUIRES=1 uv run pytest verification/test_rtl.py -v
    - name: Upload verification logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-logs
        path: |
          sim_build/**/*.log
          verification/sim_build/**/*.log
        retention-days: 7
