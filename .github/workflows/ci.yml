name: CI
on:
  push:
    branches:
      - main  # Run the tests on push to main branch
      - 47-migrate-cocotb-test-bench-to-system-verilog # temporary testing branch
  pull_request:
    branches:
      - main  # Run the tests on PRs to main branch
  schedule:
    - cron: "0 3 * * 0"  # Fixed: missing space in cron expression
jobs:
  test_common:
    runs-on: ubuntu-latest  # This specifies the runner environment
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14-dev']
        include:
          # Allow beta/dev versions to fail without failing the entire job
          - python-version: '3.14-dev'
            experimental: true
      # Continue running other versions even if experimental ones fail
      fail-fast: false
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated to v5 for better Python 3.14 support
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true  # This allows beta and dev versions
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pipx
        pipx ensurepath
        pipx install uv
        # Handle potential compatibility issues with newer Python versions
        uv sync --extra dev
    - name: Run tests
      run: uv run pytest test/test_regdef.py test/test_argparse.py test/test_validate.py
      continue-on-error: ${{ matrix.experimental || false }}
    - name: Upload test results for experimental versions
      if: matrix.experimental && always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: test-results/
        retention-days: 7

  test_rtl:
    runs-on: ubuntu-latest
    env:
      MDC_AUTOMATION_TOKEN: ${{ secrets.MDC_AUTOMATION_TOKEN }}
    strategy:
      matrix:
        sim-language: ['compile_sv', 'compile_v', 'compile_vhdl']
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pipx
        pipx ensurepath
        pipx install uv
        # Handle potential compatibility issues with newer Python versions
        uv sync --extra dev
    - name: Run AXI4-Lite register generator
      run: |
        uv run python -m axi4lite_reg_generator example/inputs/example.json --output verification/example
    - name: Install MDC
      run: |
        /bin/bash -c "$(curl -fsSL https://releasedist.blob.core.windows.net/dist-dev-releases/install_scripts/install_linux.sh)"
    - name: Run Simulation
      id: simulation
      run: |
        cd verification
        make start
        make ${{ matrix.sim-language }}
        make simulate
        make get_results
        if grep -q "\$error" dsim.log; then
          echo "ERROR: Found \$error in dsim.log"
          cat dsim.log
          exit 1
        fi
        # Check for successful completion message
        if ! grep -q "All [0-9]\+ test(s) completed successfully!" dsim.log; then
          echo "ERROR: Expected success message not found in dsim.log"
          echo "Looking for pattern: 'All X test(s) completed successfully!'"
          cat dsim.log
          exit 1
        fi
    - name: Cleanup Simulation
      if: always() && steps.simulation.conclusion != 'skipped'
      run: |
        make stop || true
    - name: Upload verification artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-results
        path: verification/
        retention-days: 30